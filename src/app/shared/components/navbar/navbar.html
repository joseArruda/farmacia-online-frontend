<header class="header-container">
  <nav class="nav">
    <div class="logo">
      <a routerLink="/">
        <img src="assets/images/logo.png" alt="logo" />
        <p class="title"><span>Farma</span> Eagle</p>
      </a>
    </div>
    <section class="section-header">
      <div class="search-bar">
        <label for="product">
          <img src="assets/icons/search.svg" alt="search" />
        </label>
        <input
          type="text"
          name="product"
          id="product"
          placeholder="Pesquisar pelo produto..."
          [(ngModel)]="search"
          (input)="searchText()"
        />
      </div>

      <div class="functions-header">
        <button
          class="menu-toggle"
          [class.active]="menuAberto"
          (click)="menuAberto = !menuAberto"
          aria-label="Abrir menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav class="menu" [class.active]="menuAberto">
          <a
            routerLink="/home"
            routerLinkActive="active-Link"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="menuAberto = false"
          >
            Home
          </a>
          <a routerLink="/cart" routerLinkActive="active-Link" (click)="menuAberto = false">
            Carrinho
          </a>
          <a routerLink="/product/new" routerLinkActive="active-Link" (click)="menuAberto = false">
            Cadastrar produtos
          </a>
          <a routerLink="/products" routerLinkActive="active-Link" (click)="menuAberto = false">
            Lista de produtos
          </a>
        </nav>
      </div>
    </section>
  </nav>
</header>
